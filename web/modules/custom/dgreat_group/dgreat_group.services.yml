services:
  dgreat_group.role_mapper:
    class: Drupal\dgreat_group\RoleGroupMapperService
    arguments:
      - '@entity_type.manager'
  dgreat_group.group_route_subscriber:
    class: Drupal\dgreat_group\Routing\GroupRouteSubscriber
    tags:
      - { name: event_subscriber }
  dgreat_group.cas_username_normalizer:
    class: Drupal\dgreat_group\EventSubscriber\CasUsernameNormalizerSubscriber
    arguments:
      - '@database'
    tags:
      - { name: event_subscriber }
