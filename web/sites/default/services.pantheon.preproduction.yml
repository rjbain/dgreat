#
# Rename this file to 'services.pantheon.preproduction.yml' and
# modify to suit.  It will then be loaded by settings.pantheon.php
# on any dev or multidev environment (not on 'test' or 'live').
#
# If you would like to define any services or service parameters
# that apply only to production environments ('test' and 'live'),
# you may do so in a 'services.pantheon.production.yml' file.
#
# See 'default.services.yml' for information on useful settings to
# put here.
#
parameters:
  session.storage.options:
    # Set session lifetime (in seconds), i.e. the time from the user's last
    # visit to the active session may be deleted by the session garbage
    # collector. When a session is deleted, authenticated users are logged out,
    # and the contents of the user's $_SESSION variable is discarded.
    # @default 200000
    gc_maxlifetime: 28800 # 8hrs

    #
    # Set session cookie lifetime (in seconds), i.e. the time from the session
    # is created to the cookie expires, i.e. when the browser is expected to
    # discard the cookie. The value 0 means "until the browser is closed".
    # @default 2000000
    cookie_lifetime: 28800 # 8hrs

services:
  Drupal\menu_link_content\Hook\MenuLinkContentHooks:
    class: Drupal\menu_link_content\Hook\MenuLinkContentHooks
    autowire: true
    autoconfigure: true
    lazy: true
  plugin.manager.menu.link:
    class: Drupal\Core\Menu\MenuLinkManager
    arguments: ['@menu.tree_storage', '@menu_link.static.overrides', '@module_handler']
    lazy: true
  menu.tree_storage:
    class: Drupal\Core\Menu\MenuTreeStorage
    arguments: ['@database', '@cache.menu', '@cache_tags.invalidator', 'menu_tree']
    public: false
    lazy: true
    tags:
      - { name: backend_overridable }
  cache_tags.invalidator:
    class: Drupal\Core\Cache\CacheTagsInvalidator
    lazy: true
    tags:
      - { name: service_collector, call: addInvalidator, tag: cache_tags_invalidator }
      - { name: service_collector, call: addBin, tag: cache.bin }
      - { name: service_collector, call: addBin, tag: cache.bin.memory }
  cache_tags.invalidator.checksum:
    class: Drupal\Core\Cache\DatabaseCacheTagsChecksum
    arguments: ['@database']
    lazy: true
    tags:
      - { name: cache_tags_invalidator }
      - { name: backend_overridable }
