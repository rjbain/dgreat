api_version: 1
web_docroot: true
php_version: 8.3
database:
  version: 10.6
drush_version: 10
search:
  version: 9
workflows:
  deploy:
    after:
      - type: webphp
        description: Install CKEditor Media Embed JS library
        script: web/private/scripts/quicksilver/ckeditor-media-embed-install.php
      - type: webphp
        description: Download Webform external JS libraries
        script: web/private/scripts/quicksilver/webform-libraries-download.php
      - type: webphp
        description: Download Chosen JS library
        script: web/private/scripts/quicksilver/chosen-library-download.php
  deploy_product:
    after:
      -
        type: webphp
        description: 'Run composer prepare-for-pantheon'
        script: private/scripts/deploy_product/prepare-for-pantheon.php
      -
        type: webphp
        description: 'Run composer install & drupal-scaffold'
        script: private/scripts/deploy_product/composer-install.php
  sync_code:
    after:
      - type: webphp
        description: Clear compiled Drupal service container after code deploy
        script: web/private/scripts/clear-compiled-container.php
      - type: webphp
        description: Install CKEditor Media Embed JS library
        script: web/private/scripts/quicksilver/ckeditor-media-embed-install.php
      - type: webphp
        description: Download Webform external JS libraries
        script: web/private/scripts/quicksilver/webform-libraries-download.php
      - type: webphp
        description: Download Chosen JS library
        script: web/private/scripts/quicksilver/chosen-library-download.php
      - type: webphp
        description: Push changes back to GitHub if needed
        script: private/scripts/quicksilver/quicksilver-pushback/push-back.php
