      styles:
        -
          label: 'text intro'
          element: '<p class="text-intro">'
        -
          label: CAPS
          element: '<span class="caps">'
        -
          label: note
          element: '<p class="note">'
        -
          label: CITE
          element: '<cite class="cite">'
        -
          label: indent
          element: '<p class="indent">'
        -
          label: Callout
          element: '<p class="callout">'
        -
          label: Thin
          element: '<p class="callout thin">'
        -
          label: '---Narrow'
          element: '<p class="callout narrow">'
        -
          label: '---Thin Narrow'
          element: '<p class="callout narrow thin">'
        -
          label: Solid
          element: '<p class="callout-tinted">'
        -
          label: '-Solid Narrow'
          element: '<p class="callout-tinted narrow">'
        -
          label: 'Button Margin Fix'
          element: '<p class="buttonMarginFix">'
