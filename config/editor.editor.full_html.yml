uuid: 596193b4-3199-435a-954a-f24291bb43ec
langcode: en
status: true
dependencies:
  config:
    - filter.format.full_html
  module:
    - ckeditor5
format: full_html
editor: ckeditor5
settings:
  toolbar:
    items:
      - heading
      - bold
      - italic
      - '|'
      - sourceEditing
      - style
      - blockQuote
      - link
      - bulletedList
      - numberedList
      - alignment
      - removeFormat
      - insertTable
      - MediaEmbed
      - drupalInsertImage
      - imce_image
      - drupalMedia
  plugins:
    ckeditor5_alignment:
      enabled_alignments:
        - center
        - justify
        - left
        - right
    ckeditor5_heading:
      enabled_headings:
        - heading2
        - heading3
        - heading4
        - heading5
        - heading6
    ckeditor5_imageResize:
      allow_resize: true
    ckeditor5_list:
      properties:
        reversed: true
        startIndex: true
        styles: true
      multiBlock: true
    ckeditor5_sourceEditing:
      allowed_tags: {  }
